version: '3.8'

services:
  linelist-cleaner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: linelist_cleaner_app
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
