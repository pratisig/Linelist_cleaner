[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linelist-cleaner"
version = "1.0.0"
description = "A comprehensive Python library and web application for cleaning, standardizing, validating, and profiling epidemiological line list data."
readme = "README.md"
authors = [{ name = "Epidemiology & Public Health Data Tools", email = "info@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.8.2",
    "rapidfuzz>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "tabulate>=0.9.0",
    "jinja2>=3.1.0",
]

[project.scripts]
linelist-cleaner = "linelist_cleaner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
