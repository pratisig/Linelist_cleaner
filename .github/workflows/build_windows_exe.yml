name: Build Windows Executable (.exe)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pyinstaller pytest httpx

      - name: Run Test Suite
        run: |
          python -m pytest -v

      - name: Build Standalone Executable (.exe) with PyInstaller
        run: |
          pyinstaller --clean Linelist_Cleaner.spec

      - name: Create Portable Zip Package
        run: |
          Compress-Archive -Path dist/Linelist_Cleaner.exe, README.md, LICENSE, MANUEL_UTILISATEUR.md -DestinationPath Linelist_Cleaner_Windows_x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linelist_Cleaner_Windows_x64
          path: |
            dist/Linelist_Cleaner.exe
            Linelist_Cleaner_Windows_x64.zip
          retention-days: 30

      - name: Publish to GitHub Releases (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Linelist_Cleaner.exe
            Linelist_Cleaner_Windows_x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
